# agentmgr.conf — tmux config used only by the agentmgr socket (-L agentmgr).
# Kept deliberately minimal so the user's tmux config is untouched. See
# spec-c-agentview-tmux.md "Local layer (tmux)".

set  -g status off
set  -g mouse on
set  -g escape-time 0
set  -g focus-events on
set  -g window-size latest
setw -g aggressive-resize on

# F12 is the only key tmux intercepts: it toggles focus between the sidebar
# pane and the content pane. Everything else reaches the active pane.
bind -n F12 select-pane -t :.+

# Quality-of-life: also bind C-b q for "quit the whole agentmgr layout" so a
# reviewer who has muscle memory in their own tmux doesn't have to hunt. This
# only affects the agentmgr socket, not the user's normal tmux.
bind q kill-server
